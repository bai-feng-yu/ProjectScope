spring.application.name=agent-backend

# Create the database before startup; Flyway owns table creation and upgrades.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/agent_backend?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USERNAME:agent_backend}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.sql.init.mode=never
llm.api-key=${LLM_API_KEY:}
llm.base-url=${LLM_BASE_URL:https://api.openai.com/v1}
llm.model=${LLM_MODEL:}
agent.max-steps=${AGENT_MAX_STEPS:10}
agent.executor.workers=${AGENT_EXECUTOR_WORKERS:2}
agent.executor.queue-capacity=${AGENT_EXECUTOR_QUEUE_CAPACITY:32}
