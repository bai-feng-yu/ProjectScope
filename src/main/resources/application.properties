spring.application.name=agent-backend

# External JWT issuer. All three required together; empty configuration rejects all Bearer tokens.
agent.security.issuer=${AUTH_ISSUER:}
agent.security.jwk-set-uri=${AUTH_JWK_SET_URI:}
agent.security.audience=${AUTH_AUDIENCE:}

# Create the database before startup; Flyway owns table creation and upgrades.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/agent_backend?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USERNAME:agent_backend}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.sql.init.mode=never
llm.api-key=${LLM_API_KEY:}
llm.base-url=${LLM_BASE_URL:https://api.openai.com/v1}
llm.model=${LLM_MODEL:}
# Network waiting limits, not a total Task/request deadline. No automatic HTTP retries.
llm.http.connection-request-timeout=${LLM_HTTP_CONNECTION_REQUEST_TIMEOUT:5s}
llm.http.connect-timeout=${LLM_HTTP_CONNECT_TIMEOUT:10s}
llm.http.response-timeout=${LLM_HTTP_RESPONSE_TIMEOUT:120s}
agent.max-steps=${AGENT_MAX_STEPS:10}
agent.executor.workers=${AGENT_EXECUTOR_WORKERS:2}
# SSE: database polling delay, idle heartbeat interval, and per-connection lifetime (milliseconds).
# Connection timeout does not cancel the task; EventSource can reconnect for a fresh snapshot.
agent.events.poll-interval-ms=${AGENT_EVENTS_POLL_INTERVAL_MS:1000}
agent.events.heartbeat-interval-ms=${AGENT_EVENTS_HEARTBEAT_INTERVAL_MS:15000}
agent.events.connection-timeout-ms=${AGENT_EVENTS_CONNECTION_TIMEOUT_MS:300000}
agent.scheduler.enabled=${AGENT_SCHEDULER_ENABLED:true}
agent.scheduler.poll-interval-ms=${AGENT_SCHEDULER_POLL_INTERVAL_MS:1000}
agent.lease.duration-ms=${AGENT_LEASE_DURATION_MS:60000}
agent.lease.heartbeat-interval-ms=${AGENT_LEASE_HEARTBEAT_INTERVAL_MS:10000}
agent.lease.recovery-interval-ms=${AGENT_LEASE_RECOVERY_INTERVAL_MS:10000}
agent.lease.recovery-batch-size=${AGENT_LEASE_RECOVERY_BATCH_SIZE:100}
